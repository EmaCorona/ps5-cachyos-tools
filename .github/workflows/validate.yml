name: validate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install static tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y g++ shellcheck systemd
      - name: Bash syntax
        run: bash -n bin/ps5-cachyos-tools lib/core/*.sh modules/boot-cleanup/*.sh modules/kde/*.sh modules/gamescope/*.sh modules/session/*.sh modules/kde/files/ps5-kde-environment.sh modules/kde/files/ps5-desktop-notify modules/gamescope/files/gamescope-session-ps5 modules/gamescope/files/ps5-drm-setup modules/gamescope/files/ps5-steam-verify-repair modules/gamescope/files/ps5-video-diag modules/session/files/session-common.sh modules/session/files/session-supervisor modules/session/files/steamos-session-select modules/session/files/ps5-tty-session.sh tests/run-tests.sh tests/core/run-tests.sh tests/core/r4-tests.sh tests/boot-cleanup-tests.sh tests/graphics-modules-tests.sh
      - name: ShellCheck
        run: shellcheck --severity=error bin/ps5-cachyos-tools lib/core/*.sh modules/boot-cleanup/*.sh modules/kde/*.sh modules/gamescope/*.sh modules/session/*.sh modules/kde/files/ps5-kde-environment.sh modules/kde/files/ps5-desktop-notify modules/gamescope/files/gamescope-session-ps5 modules/gamescope/files/ps5-drm-setup modules/gamescope/files/ps5-steam-verify-repair modules/gamescope/files/ps5-video-diag modules/session/files/session-common.sh modules/session/files/session-supervisor modules/session/files/steamos-session-select modules/session/files/ps5-tty-session.sh tests/run-tests.sh tests/core/run-tests.sh tests/core/r4-tests.sh tests/boot-cleanup-tests.sh tests/graphics-modules-tests.sh
      - name: Tests
        run: bash tests/run-tests.sh && bash tests/core/run-tests.sh
      - name: systemd unit syntax
        run: |
          staging=$(mktemp -d)
          mkdir -p "$staging/etc/systemd/system"
          for unit in local-fs.target sysinit.target; do
            printf '[Unit]\nDescription=CI stub\n' > "$staging/etc/systemd/system/$unit"
          done
          install -D -m 0755 lib/core/boot-runner.sh "$staging/usr/lib/ps5-cachyos-tools/boot-runner"
          install -D -m 0644 systemd/ps5-tools-early.service "$staging/etc/systemd/system/ps5-tools-early.service"
          install -D -m 0644 systemd/ps5-tools-boot.service "$staging/etc/systemd/system/ps5-tools-boot.service"
          printf '[Unit]\nDescription=CI stub\n' > "$staging/etc/systemd/system/basic.target"
          printf '[Unit]\nDescription=CI stub\n' > "$staging/etc/systemd/system/multi-user.target"
          systemd-analyze verify --root="$staging" ps5-tools-early.service ps5-tools-boot.service
      - name: Diff whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$BASE_SHA
            head=$HEAD_SHA
          else
            base=$BEFORE_SHA
            head=$CURRENT_SHA
            if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
              base=$(git rev-parse "$head^" 2>/dev/null || git hash-object -t tree /dev/null)
            fi
          fi
          empty_tree=$(git hash-object -t tree /dev/null)
          if [ "$base" != "$empty_tree" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse "$head^" 2>/dev/null || printf '%s' "$empty_tree")
          fi
          git cat-file -e "$head^{commit}"
          # Unified diffs embedded as .patch files intentionally contain context whitespace.
          git diff --check "$base" "$head" -- . ':(exclude)packaging/gamescope/0001-drm-use-preferred-edid-dtd.patch'
