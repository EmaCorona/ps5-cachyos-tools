OWNED_PATHS=/usr/local/libexec/ps5-cachyos-tools/gamescope-session /usr/local/bin/ps5-cachyos-tools-video-diag /usr/local/bin/ps5-cachyos-tools-steam-verify-repair /usr/local/bin/ps5-cachyos-tools-drm-setup
