# Runtime dependency: /usr/bin/python3 (standard library only), for the
# in-process Steam manifest scanner. The installer and check hook enforce it.
ID=gamescope
NAME="Gamescope gaming session support"
ENABLED=true
TYPE=task
RUN_POLICY=always
BOOT_PHASE=normal
REVISION=3
DEPENDENCIES=
FAILURE_POLICY=continue
INSTALL_WHEN_DISABLED=true
POST_INSTALL_HOOK=package.sh
POST_REMOVE_HOOK=package-remove.sh
TRANSACTION_PATHS=/etc/ps5-cachyos-tools/gamescope.conf /usr/share/xdg-desktop-portal/gamescope-portals.conf /var/lib/ps5-cachyos-tools/gamescope/originals/portal.state /var/lib/ps5-cachyos-tools/gamescope/originals/portal.backup /var/lib/ps5-cachyos-tools/gamescope/package.transaction
OWNED_PATHS=/usr/local/libexec/ps5-cachyos-tools/gamescope-session /usr/local/libexec/ps5-cachyos-tools/gamescope-package /usr/local/bin/ps5-cachyos-tools-gamescope-display-mode /usr/local/bin/ps5-cachyos-tools-video-diag /usr/local/bin/ps5-cachyos-tools-steam-verify-repair /usr/local/bin/ps5-cachyos-tools-drm-setup
