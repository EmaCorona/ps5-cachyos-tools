ID=boot-cleanup
NAME="Bounded boot cleanup"
ENABLED=true
TYPE=task
RUN_POLICY=always
BOOT_PHASE=early
REVISION=2
DEPENDENCIES=
FAILURE_POLICY=continue
REQUIRES_BOOT=false
INSTALL_WHEN_DISABLED=true
TRANSACTION_PATHS=/etc/ps5-cachyos-tools/boot-cleanup.conf
OWNED_PATHS=/run/ps5-cachyos-tools/boot-cleanup/cleanup.state /run/ps5-cachyos-tools/boot-cleanup/steam-stale.list /var/lib/ps5-cachyos-tools/boot-cleanup/migration.state
