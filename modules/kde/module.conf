ID=kde
NAME="KDE Plasma Wayland compatibility"
ENABLED=true
TYPE=task
RUN_POLICY=always
BOOT_PHASE=normal
REVISION=1
DEPENDENCIES=
FAILURE_POLICY=continue
INSTALL_WHEN_DISABLED=true
TRANSACTION_PATHS=/etc/group /var/lib/ps5-cachyos-tools/kde/added-groups
OWNED_PATHS=/etc/profile.d/ps5-kde-environment.sh /usr/local/bin/ps5-cachyos-tools-desktop-notify /etc/xdg/autostart/ps5-cachyos-tools-desktop-notify.desktop
