ID=session
NAME="PS5 graphical session selector and fallback"
ENABLED=true
TYPE=task
RUN_POLICY=always
BOOT_PHASE=normal
REVISION=1
DEPENDENCIES=kde gamescope
FAILURE_POLICY=continue
INSTALL_WHEN_DISABLED=true
TRANSACTION_PATHS=/home/steam/.config/ps5-cachyos-tools/session.conf /etc/profile.d/ps5-tty-session.sh /usr/bin/steamos-session-select /var/lib/ps5-cachyos-tools/session/originals/profile.state /var/lib/ps5-cachyos-tools/session/originals/profile.backup /var/lib/ps5-cachyos-tools/session/originals/selector.state /var/lib/ps5-cachyos-tools/session/originals/selector.backup
OWNED_PATHS=/usr/local/libexec/ps5-cachyos-tools/session-common.sh /usr/local/libexec/ps5-cachyos-tools/session-supervisor
